services:
  db:
    image: postgres:16-alpine
    container_name: traffic_db
    environment:
      POSTGRES_DB: traffic_violations
      POSTGRES_USER: traffic_user
      POSTGRES_PASSWORD: traffic_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_user -d traffic_violations"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
